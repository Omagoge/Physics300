<!doctype html>
<html lang="en">
<head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Pause Menu</title>
        <link rel="stylesheet" href="MainMenu.css" />
        <link rel="stylesheet" href="PauseMenu.css" />
</head>
<body>
        <div id="bg">
                <div id="bgTint"></div>
        </div>

        <div class="content">
                <div class="title" id="pauseTitle">
                        <div class="gameTitle">PAUSED</div>
                </div>

                <nav class="menu" id="pauseMenu">
                        <li id="continue">CONTINUE</li>
                        <li id="settings">SETTINGS</li>
                        <li id="exit">EXIT</li>
                </nav>

                <div class="hint">↑/↓ Move · Enter/A Select · Esc/B Back</div>
        </div>

        <script src="PauseMenu.js"></script>
</body>
</html>
