<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fade Effect</title>
        <style>
                #effect {
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        background-color: transparent;
                        z-index: 10;
                }

                #loading {
                        position: fixed;
                        bottom: 20px;
                        right: 20px;
                        width: 100px;
                        height: auto;
                        opacity: 0;
                        z-index: 20;
                        pointer-events: none;
                }

                @keyframes toBlack {
                        from { background-color: transparent; }
                        to { background-color: black; }
                }

                @keyframes toTransparent {
                        from { background-color: black; }
                        to { background-color: transparent; }
                }

                @keyframes fadeIn {
                        from { opacity: 0; }
                        to { opacity: 1; }
                }

                @keyframes fadeOut {
                        from { opacity: 1; }
                        to { opacity: 0; }
                }

                .is-black #effect {
                        animation: toBlack 0.6s forwards;
                }

                .is-transparent #effect {
                        animation: toTransparent 0.6s forwards;
                }

                .is-black #loading {
                        animation: fadeIn 0.6s forwards;
                }

                .is-transparent #loading {
                        animation: fadeOut 0.6s forwards;
                }
        </style>
</head>
<body>

        <div id="effect"></div>
        <img id="loading" src="images/LoadingCatWhite.gif" alt="Loading...">

        <script>
                function fadeIn() {
                        document.body.classList.remove('is-transparent');
                        document.body.classList.add('is-black');
                        console.log('FadingIn');
                }

                function fadeOut() {
                        document.body.classList.remove('is-black');
                        document.body.classList.add('is-transparent');
                        console.log('FadingOut');
                }
        </script>

</body>
</html>
