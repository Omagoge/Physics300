<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Thanks for playing</title>
        <script src="ThanksForPlaying.js" defer></script>
        <style>
				body {
					-webkit-user-select: none;
					user-select: none;
				}
				
                .bg {
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        z-index: -1;
                        overflow: hidden;

                        background-color: black;
                }

                .content {
                        font-family: 'Orbitron', sans-serif;
                        font-weight: 500;
                        color: white;
                        display: flex;
                        flex-direction: column;
                        justify-content: space-between;
                        height: 98vh;
                }

                .title {
                        font-size: 6vw;
                        font-weight: 700;
                }

                .menu {
                        font-size: 3.5vw;
                        list-style: none;
                        padding-left: 10%;
                }

                .menu li {
                        cursor: pointer;
                        width: fit-content;
                        padding: 5px 10px;
                        border: 2px solid transparent;
                        transition: all 0.3s ease;
                }

                .menu li:hover,
                .menu li.focused {
                        border: 7px solid white;
                        border-radius: 4px;
                }

                .menu li:active,
                .menu li.active {
                        background-color: white;
                        color: black;
                        border-color: white;
                }
        </style>
</head>
<body>
        <div class="bg"></div>
        <div class="content">
                <div class="title">THANKS<br>FOR<br>PLAYING</div>

                <nav class="menu" id="thanksMenu">
                        <li id="form">GOOGLE FORMS</li>
                        <li id="main-menu">MAIN MENU</li>
                </nav>

                <div></div>
        </div>
</body>
</html>
