<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="timer.css">
</head>
<body style="background: transparent; margin: 0; padding: 0;">
    <div id="timer-container">
        <div id="timer">
            <span id="minutes">00</span>:<span id="seconds">00</span><span class="ms">.<span id="milliseconds">000</span></span>
        </div>
    </div>

    <script>
        const minElem = document.getElementById('minutes');
        const secElem = document.getElementById('seconds');
        const msElem = document.getElementById('milliseconds');

        function updateTimer(totalMilliseconds) {
            if (!minElem || !secElem || !msElem) return;
            const minutes = Math.floor(totalMilliseconds / 60000);
            const seconds = Math.floor((totalMilliseconds % 60000) / 1000);
            const ms = Math.floor(totalMilliseconds % 1000);

            minElem.textContent = minutes.toString().padStart(2, '0');
            secElem.textContent = seconds.toString().padStart(2, '0');
            msElem.textContent = ms.toString().padStart(3, '0');
        }
    </script>
</body>
</html>
