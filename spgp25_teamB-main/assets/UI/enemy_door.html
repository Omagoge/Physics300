<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ratio Display</title>
	<style>
		body {
			font-family: 'Orbitron', sans-serif;
			font-weight: 700;

			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;

			/* background-color: #3fffff; */
		}

		#ratio-display {
			font-size: 300px;
			font-weight: bold;
			color: #FFFFFF;
		}
	</style>
</head>

<body>

	<div id="ratio-display">Waiting for ratio...</div>

	<script>
		function SetRatio(n, d) {
			// Target the display div and update its text content
			const display = document.getElementById('ratio-display');
			display.textContent = `${n} / ${d} ☠️`;
		}

		// Example usage: You can open the browser console and type SetRatio(5, 8) to change it.
		// Initializing with an example:
		SetRatio(1, 2);
	</script>

</body>

</html>
